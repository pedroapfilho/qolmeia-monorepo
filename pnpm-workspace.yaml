packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

# Force a single React copy across the tree. After the dep bump a transitive
# dep (use-sync-external-store, via @tanstack/react-store) resolved its own
# react 19.2.6 alongside the workspace's 19.2.7, giving two React instances and
# a null hook dispatcher ("Cannot read properties of null (reading 'useRef')")
# in component tests. Keep these in step with the apps' react version on bump.
overrides:
  react: 19.2.7
  react-dom: 19.2.7

# pnpm 11 home for the former package.json `pnpm.onlyBuiltDependencies` list.
# @mongodb-js/zstd + node-liblzma are optional native compression accelerators
# pulled transitively via agents → just-bash. The Cloudflare Worker can't load
# native addons (just-bash falls back to pure JS), so their builds are skipped
# to avoid CI native-toolchain churn.
allowBuilds:
  # Pulled transitively via Flue (@flue/runtime → pi-ai provider layer). Pure JS,
  # safe to build on install.
  "@google/genai": true
  "@mongodb-js/zstd": false
  "@prisma/client": true
  "@prisma/engines": true
  core-js-pure: true
  esbuild: true
  fallow: true
  msw: true
  node-liblzma: false
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - cnfast@0.0.8
  - "@shadcn/react@0.2.0"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2001"
  - "@oxlint-tsgolint/darwin-x64@7.0.2001"
  - "@oxlint-tsgolint/linux-arm64@7.0.2001"
  - "@oxlint-tsgolint/linux-x64@7.0.2001"
  - "@oxlint-tsgolint/win32-arm64@7.0.2001"
  - "@oxlint-tsgolint/win32-x64@7.0.2001"
  - "@oxlint/binding-android-arm-eabi@1.75.0"
  - "@oxlint/binding-android-arm64@1.75.0"
  - "@oxlint/binding-darwin-arm64@1.75.0"
  - "@oxlint/binding-darwin-x64@1.75.0"
  - "@oxlint/binding-freebsd-x64@1.75.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.75.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.75.0"
  - "@oxlint/binding-linux-arm64-gnu@1.75.0"
  - "@oxlint/binding-linux-arm64-musl@1.75.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.75.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.75.0"
  - "@oxlint/binding-linux-riscv64-musl@1.75.0"
  - "@oxlint/binding-linux-s390x-gnu@1.75.0"
  - "@oxlint/binding-linux-x64-gnu@1.75.0"
  - "@oxlint/binding-linux-x64-musl@1.75.0"
  - "@oxlint/binding-openharmony-arm64@1.75.0"
  - "@oxlint/binding-win32-arm64-msvc@1.75.0"
  - "@oxlint/binding-win32-ia32-msvc@1.75.0"
  - "@oxlint/binding-win32-x64-msvc@1.75.0"
  - oxlint-tsgolint@7.0.2001
  - oxlint@1.75.0
  - oxlint-config-awesomeness@3.2.0
