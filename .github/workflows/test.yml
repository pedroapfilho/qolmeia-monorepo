name: Test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://qolmeia:qolmeia@localhost:5432/qolmeia_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qolmeia
          POSTGRES_PASSWORD: qolmeia
          POSTGRES_DB: qolmeia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qolmeia -d qolmeia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1.0.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm test
