name: qolmeia

services:
  postgres:
    image: postgres:18-alpine
    container_name: qolmeia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qolmeia
      POSTGRES_PASSWORD: qolmeia123
      POSTGRES_DB: qolmeia
    ports:
      - "5436:5432"
    volumes:
      # Postgres 18 expects the mount at /var/lib/postgresql (major-version
      # subdir lives inside). See docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qolmeia -d qolmeia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local
